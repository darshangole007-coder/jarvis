<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. | Mark VII</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/neon/96/000000/iron-man.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root { --glow: #00e5ff; --bg: #050a0f; --error: #ff3d00; --active: #00ff66; }
        body { background-color: var(--bg); background-image: radial-gradient(circle at center, #0a1f2e 0%, #050a0f 100%); color: var(--glow); font-family: 'Rajdhani', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #container { width: 90%; max-width: 800px; display: flex; flex-direction: column; align-items: center; }
        #core { width: 120px; height: 120px; border-radius: 50%; border: 2px solid var(--glow); box-shadow: 0 0 20px var(--glow), inset 0 0 15px var(--glow); margin-bottom: 20px; display: flex; justify-content: center; align-items: center; animation: pulse 2s infinite ease-in-out; }
        .inner-core { width: 70%; height: 70%; border: 1px dashed var(--glow); border-radius: 50%; animation: spin 8s linear infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 30px var(--glow); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #chat-box { width: 100%; height: 350px; background: rgba(0, 229, 255, 0.03); border: 1px solid rgba(0, 229, 255, 0.2); padding: 20px; overflow-y: auto; margin-bottom: 20px; scrollbar-width: thin; scrollbar-color: var(--glow) transparent; }
        .msg { margin: 12px 0; font-size: 1.1rem; line-height: 1.4; }
        .user { color: #fff; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
        .jarvis { color: var(--glow); border-left: 2px solid var(--glow); padding-left: 12px; }
        .error-msg { color: var(--error); border-left: 2px solid var(--error); }
        .input-area { display: flex; width: 100%; gap: 15px; }
        input { flex: 1; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--glow); padding: 15px; color: var(--glow); font-family: 'Orbitron'; outline: none; transition: 0.3s; }
        input:focus { background: rgba(0, 229, 255, 0.1); box-shadow: 0 0 15px rgba(0, 229, 255, 0.2); }
        button { background: var(--glow); border: none; padding: 0 30px; cursor: pointer; font-family: 'Orbitron'; font-weight: bold; color: var(--bg); transition: 0.3s; }
        button:hover { background: #fff; box-shadow: 0 0 20px #fff; transform: translateY(-2px); }
        #mic-btn.active { background: var(--active); box-shadow: 0 0 20px var(--active); }
    </style>
</head>
<body>
    <div id="container">
        <div id="core"><div class="inner-core"></div></div>
        <h2 style="font-family: 'Orbitron'; letter-spacing: 4px; margin-bottom: 20px;">MARK VII: ONLINE</h2>
        <div id="chat-box"></div>
        <div class="input-area">
            <button id="mic-btn" onclick="toggleVoice()">MIC</button>
            <input id="commandInput" placeholder="AWAITING ORDERS..." onkeypress="if(event.key==='Enter') sendCommand()"/>
            <button onclick="sendCommand()">EXECUTE</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const input = document.getElementById('commandInput');
        const micBtn = document.getElementById('mic-btn');
        let voiceActive = false;

        function addMessage(role, text, isError = false) {
            const div = document.createElement('div');
            div.className = `msg ${role.toLowerCase()} ${isError ? 'error-msg' : ''}`;
            div.innerHTML = `<span class="${role.toLowerCase()}">${role}:</span> ${text}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendCommand() {
            const msg = input.value.trim();
            if (!msg) return;
            
            addMessage('USER', msg);
            input.value = '';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: msg})
                });
                
                if (!response.ok) throw new Error('Offline');
                const data = await response.json();
                addMessage('JARVIS', data.reply);
            } catch (error) {
                addMessage('JARVIS', "Server unreachable. Operating on emergency backup power.", true);
            }
        }

        async function toggleVoice() {
            const endpoint = voiceActive ? '/voice/stop' : '/voice/start';
            try {
                const res = await fetch(endpoint, { method: 'POST' });
                if (res.ok) {
                    voiceActive = !voiceActive;
                    micBtn.classList.toggle('active', voiceActive);
                    addMessage('JARVIS', voiceActive ? "Voice monitoring activated. Listening for your command..." : "Voice monitoring suspended.");
                } else {
                    addMessage('JARVIS', "Failed to toggle audio drivers.", true);
                }
            } catch (err) {
                addMessage('JARVIS', "Unable to interface with backend audio endpoints.", true);
            }
        }

        window.onload = () => {
            setTimeout(() => addMessage('JARVIS', 'Systems stabilized. Core protocols updated. At your service, sir.'), 500);
        };
    </script>
</body>
</html>
